[project]
name = "pr-explain"
version = "0.1.0"
description = "Explain a pull request from evidence-backed claims."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "tree-sitter>=0.25",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["explanation/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
